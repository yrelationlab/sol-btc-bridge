[toolchain]
anchor_version = "0.29.0"
solana_version = "2.0.23" # Solana version to use(applies to all Solana tools)

[features]
seeds = false
skip-lint = false

[programs.mainnet]
bridge = "Am2aeLabeQBtENUpMvEv8cWqnaiFzFBF1GtS8gHkhLLs"

[programs.devnet]
bridge = "Am2aeLabeQBtENUpMvEv8cWqnaiFzFBF1GtS8gHkhLLs"

[programs.localnet]
bridge = "Am2aeLabeQBtENUpMvEv8cWqnaiFzFBF1GtS8gHkhLLs"


[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
# cluster = "https://broken-twilight-paper.solana-devnet.quiknode.pro/e0bcf0275d294a569bd60a39c2a3f99d678b14d4"
wallet = "./sdk/.config/secret.json"

[provider.localnet]
rpc_url = "http://127.0.0.1:8900"


[scripts]
test = "vitest --test-timeout=5000 4"

# use localnet for test
[test]
startup_wait = 5000
shutdown_wait = 5000
