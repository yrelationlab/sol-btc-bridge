[package]
name = "bridge"
version = "0.1.0"
description = "Created with Expert"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bridge"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
devnet = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["metadata"] }
solana-program = ">=1.16, <1.18"
fixed = "=1.23.1"
spl-memo = "4.0.0"
bytemuck = "1.7.3"
hex = "0.4"
bs58 = "0.5.1"
base64= "0.22.1"